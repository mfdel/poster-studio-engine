[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poster-studio-engine"
version = "0.1.0"
description = "Deterministic data-to-art Python pipeline converting OpenStreetMap and astronomical data into print-ready posters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "cairosvg>=2.7.1",
    "shapely>=2.0.0",
    "folium>=0.16.0",
    "pypdf>=4.0.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools]
packages = ["posterlab", "posterlab.geo", "posterlab.map", "posterlab.svg", "posterlab.chrome"]
